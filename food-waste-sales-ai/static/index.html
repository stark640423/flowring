<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>廚餘機業務 AI</title>
<style>
  :root {
    --bg: #f5f7f4; --panel: #ffffff; --text: #1f2a22; --muted: #6b776e;
    --accent: #2f7d4f; --accent-soft: #e3f1e8; --border: #dde4de; --bot: #f0f3f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141916; --panel: #1c2320; --text: #e6ece8; --muted: #93a198;
      --accent: #5cc184; --accent-soft: #23372b; --border: #2c3631; --bot: #242d29;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
         background: var(--bg); color: var(--text); }
  .wrap { max-width: 760px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; padding: 0 16px; }
  header { padding: 16px 0 8px; }
  h1 { font-size: 1.25rem; margin: 0 0 10px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--border); background: var(--panel); color: var(--text);
                 padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: .95rem; }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .token { margin-top: 8px; display: none; gap: 6px; align-items: center; font-size: .9rem; color: var(--muted); }
  .token.show { display: flex; }
  .token input { flex: 1; max-width: 220px; }
  main { flex: 1; overflow-y: auto; padding: 8px 0; }
  .msg { margin: 10px 0; display: flex; }
  .msg .bubble { padding: 10px 14px; border-radius: 14px; max-width: 85%; white-space: pre-wrap; line-height: 1.6; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--bot); border-bottom-left-radius: 4px; }
  .hint { color: var(--muted); font-size: .92rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips button { border: 1px solid var(--border); background: var(--accent-soft); color: var(--text);
                  padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: .88rem; }
  form { display: flex; gap: 8px; padding: 10px 0 16px; }
  textarea, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border);
                    border-radius: 10px; padding: 10px 12px; }
  textarea { flex: 1; resize: none; min-height: 46px; max-height: 160px; }
  form button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 0 18px;
                font-size: 1rem; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; min-width: 760px; border-collapse: collapse; font-size: .88rem; }
  th { white-space: nowrap; }
  th, td { border-bottom: 1px solid var(--border); padding: 8px 6px; text-align: left; vertical-align: top; }
  .table-wrap { overflow-x: auto; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0 10px; }
  .bar .hint { flex: 1; min-width: 160px; margin: 0; }
  .btn { font: inherit; font-size: .9rem; border: 1px solid var(--border); background: var(--panel); color: var(--text);
         border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.danger { color: #c0392b; padding: 2px 8px; font-size: .8rem; }
  textarea.kb-area { width: 100%; flex: none; min-height: 55vh; max-height: none; resize: vertical; line-height: 1.6; font-size: .92rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>♻️ 廚餘機業務 AI</h1>
    <div class="tabs">
      <button data-mode="customer" class="active">客戶諮詢</button>
      <button data-mode="sales">業務助理</button>
      <button data-mode="kb">產品資料</button>
      <button data-mode="leads">客戶名單</button>
    </div>
    <div class="token" id="tokenRow">
      業務密碼 <input id="token" type="password" autocomplete="off">
    </div>
  </header>
  <main id="log"></main>
  <form id="form">
    <textarea id="input" rows="1" placeholder="輸入訊息…（Enter 送出，Shift+Enter 換行）"></textarea>
    <button id="send" type="submit">送出</button>
  </form>
</div>
<script>
const INTRO = {
  customer: {
    text: "您好！我是廚餘機小幫手 😊 想了解哪一款適合您家嗎？",
    chips: ["我家 4 個人，推薦哪一台？", "會不會很吵、很臭？", "水槽下的跟桌上型差在哪？", "有什麼優惠？"],
  },
  sales: {
    text: "業務助理模式：可以幫你寫文案、準備話術、處理客戶異議。",
    chips: ["寫一則給老客戶的 LINE 推播", "客戶說「太貴了」怎麼回？", "幫我寫電話開場白", "寫 3 版 FB 貼文"],
  },
};
const state = { mode: "customer", history: { customer: [], sales: [] }, busy: false, needsToken: false };
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), sendBtn = $("send"), form = $("form");

function safeGet(k) { try { return sessionStorage.getItem(k) || ""; } catch { return ""; } }
function safeSet(k, v) { try { sessionStorage.setItem(k, v); } catch {} }
$("token").value = safeGet("adminToken");
$("token").addEventListener("input", (e) => safeSet("adminToken", e.target.value));

fetch("/api/config").then(r => r.json()).then(c => { state.needsToken = c.sales_requires_token; render(); }).catch(() => {});

function bubble(role, text) {
  const row = document.createElement("div");
  row.className = "msg " + role;
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  row.appendChild(b);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.mode === state.mode));
  $("tokenRow").classList.toggle("show", state.needsToken && state.mode !== "customer");
  form.style.display = state.mode === "leads" || state.mode === "kb" ? "none" : "flex";
  log.innerHTML = "";
  if (state.mode === "leads") return renderLeads();
  if (state.mode === "kb") return renderKb();
  const intro = INTRO[state.mode];
  const b = bubble("assistant", intro.text);
  const chips = document.createElement("div");
  chips.className = "chips";
  intro.chips.forEach(c => {
    const btn = document.createElement("button");
    btn.type = "button"; btn.textContent = c;
    btn.onclick = () => send(c);
    chips.appendChild(btn);
  });
  b.appendChild(chips);
  state.history[state.mode].forEach(m => bubble(m.role, m.content));
}

const authHeaders = () => ({ "X-Admin-Token": $("token").value });

function el(tag, props = {}, text) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  if (text !== undefined) e.textContent = text;
  return e;
}

async function renderLeads() {
  const p = el("p", { className: "hint" }, "載入中…");
  log.appendChild(p);
  try {
    const r = await fetch("/api/leads", { headers: authHeaders() });
    if (r.status === 401) { p.textContent = "請在上方輸入業務密碼後，再點一次「客戶名單」。"; return; }
    const rows = await r.json();
    if (state.mode !== "leads") return;
    if (!rows.length) { p.textContent = "目前還沒有客戶留資料。客戶在「客戶諮詢」留下姓名和電話後，會出現在這裡。"; return; }
    p.remove();
    const bar = el("div", { className: "bar" });
    bar.appendChild(el("p", { className: "hint" }, `共 ${rows.length} 筆，最新的在最上面。`));
    const dl = el("button", { className: "btn", type: "button" }, "下載 Excel 檔（CSV）");
    dl.onclick = downloadLeads;
    bar.appendChild(dl);
    log.appendChild(bar);
    const cols = { time: "時間", name: "姓名", phone: "電話", line_id: "LINE", household_size: "人數",
                   interested_model: "有興趣機型", needs: "需求", contact_time: "方便聯絡" };
    const wrap = el("div", { className: "table-wrap" });
    const t = el("table");
    const head = t.insertRow();
    [...Object.values(cols), ""].forEach(c => head.appendChild(el("th", {}, c)));
    rows.slice().reverse().forEach(row => {
      const tr = t.insertRow();
      Object.keys(cols).forEach(k => { tr.insertCell().textContent = row[k] || ""; });
      const cell = tr.insertCell();
      if (!row.id) return;
      const del = el("button", { className: "btn danger", type: "button" }, "刪除");
      del.onclick = async () => {
        if (del.dataset.armed !== "1") { del.dataset.armed = "1"; del.textContent = "確定刪除？"; return; }
        del.disabled = true;
        const res = await fetch("/api/leads/" + encodeURIComponent(row.id), { method: "DELETE", headers: authHeaders() }).catch(() => null);
        if (res?.ok) tr.remove(); else { del.disabled = false; del.textContent = "刪除失敗，再按一次"; del.dataset.armed = "1"; }
      };
      cell.appendChild(del);
    });
    wrap.appendChild(t); log.appendChild(wrap);
  } catch { p.textContent = "讀取失敗，請稍後再試。"; }
}

async function downloadLeads() {
  const r = await fetch("/api/leads.csv", { headers: authHeaders() }).catch(() => null);
  if (!r?.ok) return;
  const url = URL.createObjectURL(await r.blob());
  const a = el("a", { href: url, download: "客戶名單.csv" });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function renderKb() {
  const info = el("p", { className: "hint" }, "載入中…");
  log.appendChild(info);
  const r = await fetch("/api/knowledge", { headers: authHeaders() }).catch(() => null);
  if (!r) { info.textContent = "讀取失敗，請稍後再試。"; return; }
  if (r.status === 401) { info.textContent = "請在上方輸入業務密碼後，再點一次「產品資料」。"; return; }
  const kb = await r.json();
  if (state.mode !== "kb") return;
  info.remove();
  const bar = el("div", { className: "bar" });
  const note = el("p", { className: "hint" },
    "AI 只會依照這份資料回答，儲存後下一則訊息就會套用。" +
    (kb.edited_on_web ? `（目前使用網頁上修改的版本，${kb.updated_at.replace("T", " ")} 更新）` : "（目前使用 GitHub 上的版本）"));
  const reset = el("button", { className: "btn", type: "button", hidden: !kb.edited_on_web }, "改回 GitHub 版本");
  const save = el("button", { className: "btn primary", type: "button", disabled: true }, "儲存");
  bar.append(note, reset, save);
  const area = el("textarea", { className: "kb-area", id: "kbText", value: kb.text });
  area.oninput = () => { save.disabled = area.value === kb.text || !area.value.trim(); };
  save.onclick = async () => {
    save.disabled = true;
    const res = await fetch("/api/knowledge", {
      method: "PUT", headers: { ...authHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify({ text: area.value }),
    }).catch(() => null);
    if (res?.ok) { log.innerHTML = ""; renderKb(); }
    else { save.disabled = false; note.textContent = "儲存失敗：請確認業務密碼正確，或內容是否超過 20 萬字。"; }
  };
  reset.onclick = async () => {
    if (reset.dataset.armed !== "1") { reset.dataset.armed = "1"; reset.textContent = "確定改回？網頁上的修改會被刪除"; return; }
    const res = await fetch("/api/knowledge", { method: "DELETE", headers: authHeaders() }).catch(() => null);
    if (res?.ok) { log.innerHTML = ""; renderKb(); } else note.textContent = "還原失敗，請稍後再試。";
  };
  log.append(bar, area);
}

async function send(text) {
  text = text.trim();
  if (!text || state.busy) return;
  const mode = state.mode;
  const history = state.history[mode];
  history.push({ role: "user", content: text });
  bubble("user", text);
  input.value = "";
  const out = bubble("assistant", "…");
  state.busy = true; sendBtn.disabled = true;
  let reply = "";
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Token": $("token").value },
      body: JSON.stringify({ mode, messages: history.slice(-40) }),
    });
    if (!r.ok) {
      reply = r.status === 401 ? "請先在上方輸入業務密碼。" : "發生錯誤（" + r.status + "），請稍後再試。";
      history.pop();
    } else {
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        reply += dec.decode(value, { stream: true });
        out.textContent = reply;
        log.scrollTop = log.scrollHeight;
      }
      reply = reply.trim();
      history.push({ role: "assistant", content: reply || "（沒有回應，請再試一次）" });
    }
  } catch {
    reply = "連線失敗，請稍後再試。";
    history.pop();
  }
  out.textContent = reply || "（沒有回應，請再試一次）";
  state.busy = false; sendBtn.disabled = false;
  input.focus();
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { state.mode = b.dataset.mode; render(); });
form.onsubmit = (e) => { e.preventDefault(); send(input.value); };
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
});
render();
</script>
</body>
</html>
